font-size="11" font-weight="600" fill="#0969da" text-anchor="middle" >LLM</text><rect x="60" y="234" width="376" height="34" rx="6" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="1"/><text x="72" y="256" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" >Темп по вопросам</text><rect x="452" y="234" width="376" height="34" rx="6" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="1"/><text x="464" y="256" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" >Матрицы и массовый выбор</text><rect x="60" y="276" width="376" height="34" rx="6" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="1"/><text x="72" y="298" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" >Прототип, сайт, сортировка</text><rect x="452" y="276" width="376" height="34" rx="6" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="1"/><text x="464" y="298" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" >Дубли ответов, тексты из ИИ</text><text x="60" y="324" font-size="16" font-weight="400" fill="#59636e" text-anchor="start" >Детектор отдаёт сигнал с силой, не вердикт</text><path d="M440 342 V366" stroke="#d0d7de" stroke-width="1.5" fill="none"/><path d="M435 360 L440 366 L445 360" stroke="#d0d7de" stroke-width="1.5" fill="none"/><rect x="40" y="366" width="800" height="236" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/><text x="60" y="394" font-size="12" font-weight="600" fill="#0969da" text-anchor="start" letter-spacing=".06em">УРОВЕНЬ 2 · КВОРУМ</text><text x="60" y="422" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start" >Сводная оценка</text><text x="230" y="422" font-size="16" font-weight="400" fill="#59636e" text-anchor="start" >вероятность брака по совокупности сигналов</text><rect x="60" y="438" width="760" height="36" rx="6" fill="#ffebe9" stroke="#ffebe9" stroke-width="1"/><circle cx="78" cy="456" r="4" fill="#cf222e"/><text x="92" y="461" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" >block · совокупность сигналов с высокой вероятностью предсказывает брак</text><rect x="60" y="482" width="760" height="36" rx="6" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="1"/><circle cx="78" cy="500" r="4" fill="#0969da"/><text x="92" y="505" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" >review · сигналы есть, но уверенности нет: смотрит человек</text><rect x="60" y="526" width="760" height="36" rx="6" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="1"/><circle cx="78" cy="544" r="4" fill="#6e7781"/><text x="92" y="549" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start" >keep · сигналов нет: ответ не трогаем</text><text x="60" y="584" font-size="16" font-weight="400" fill="#59636e" text-anchor="start" >Веса сигналов измерены на большой размеченной выборке; у вердикта есть улики</text><path d="M440 602 V626" stroke="#d0d7de" stroke-width="1.5" fill="none"/><path d="M435 620 L440 626 L445 620" stroke="#d0d7de" stroke-width="1.5" fill="none"/><rect x="40" y="626" width="800" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="60" y="662" font-size="12" font-weight="600" fill="#6e7781" text-anchor="start" letter-spacing=".06em">ЕСЛИ НУЖНО</text><text x="230" y="664" font-size="18" font-weight="600" fill="#1f2328" text-anchor="start" >Ручная проверка</text><text x="420" y="664" font-size="16" font-weight="400" fill="#59636e" text-anchor="start" >только очередь review, с уликами</text></svg>